<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width-device-width,initial-scale=1.0">
        <title>WEATHER APP </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
     <div class="card">
        <div class="search">
          <input type="text" placeholder="ENTER CITY NAME"
          spellcheck="false">
          <button><img src="images weat/search.png"></button>
        </div>
        <div class="weather">
            <img src="images weat/rain.png" class="weather-icon">
            <h1 class="temp">22°c</h1>
            <h2 class="city">Hyderabad</h2>
            <div class="details">
                <div class="col">
                    <img src="images weat/humidity.png">
                <div>
                <p class="humidity">50%</p>
                <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="images weat/wind.png">
            <div>
            <p class="WIND">15 KM/H</p>
            <p>Wind Speed</p>
            </div>
        </div>
        </div>
     </div>

    </body>
</html>
